name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security pre-flight checks
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified
        # Skip if this is the first commit or base equals head
        if: github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.event.after

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and test Go API
  build-api:
    needs: security-preflight
    runs-on: ubuntu-latest

    # The tests that matter here run against a real Postgres, because the
    # defects they catch are schema mismatches — a query naming a column or a
    # table that does not exist. Three of those reached production unnoticed
    # (users.full_name, citizen_complaints.complaint_number, and joins against
    # police_stations, a table with no rows) precisely because CI had no
    # database and every database-backed test skipped in silence. The force
    # boundary between departments is enforced in SQL and is a disclosure risk
    # if it breaks; it is not protection if its tests never run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: npdms
          POSTGRES_PASSWORD: npdms
          POSTGRES_DB: npdms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('services/api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          cd services/api
          go mod tidy
          go mod download

      - name: Run go vet
        run: |
          cd services/api
          go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          working-directory: services/api

      - name: Build
        run: |
          cd services/api
          go build -o bin/api ./...

      - name: Build the test database
        env:
          DATABASE_URL: postgres://npdms:npdms@localhost:5432/npdms?sslmode=disable
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          ./scripts/bootstrap-db.sh --with-demo-data

      - name: Load the departments and their officers
        env:
          DATABASE_URL: postgres://npdms:npdms@localhost:5432/npdms?sslmode=disable
          DEMO_SEED_CONFIRM: "yes"
        run: python3 scripts/seed-departments-demo.py

      - name: Run tests with coverage
        env:
          # Without this the database-backed tests skip, which is how the
          # schema mismatches above went unnoticed.
          TEST_DATABASE_URL: postgres://npdms:npdms@localhost:5432/npdms?sslmode=disable
        run: |
          cd services/api
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Confirm the database tests actually ran
        run: |
          cd services/api
          # A suite that skips everything is green and worthless. The force
          # boundary is the one rule whose failure is a disclosure, so its
          # tests passing is asserted here rather than assumed.
          TEST_DATABASE_URL=postgres://npdms:npdms@localhost:5432/npdms?sslmode=disable \
            go test ./internal/repository/ -run 'TestAnOfficerSeesOnlyTheirOwnForcesRegister|TestAReferralIsWhatLetsARecordCross' -v \
            | tee boundary.log
          grep -q -- '--- PASS: TestAnOfficerSeesOnlyTheirOwnForcesRegister' boundary.log
          grep -q -- '--- PASS: TestAReferralIsWhatLetsARecordCross' boundary.log

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/api/coverage.out
          flags: api
          token: ${{ secrets.CODECOV_TOKEN }}

  # Build and test Python ML services
  build-ml:
    needs: security-preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [fir_classifier, semantic_search, ocr_service, nlp_extractor]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.service }}-${{ hashFiles(format('services/ml/{0}/requirements.txt', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.service }}-

      - name: Install dependencies
        run: |
          cd services/ml/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Run Ruff linter
        run: |
          cd services/ml/${{ matrix.service }}
          ruff check . || true

      - name: Run tests
        run: |
          cd services/ml/${{ matrix.service }}
          pytest --cov=. --cov-report=xml tests/ || true

  # Security scans
  security-scan:
    needs: [build-api, build-ml]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SAST with Semgrep
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/golang
            p/typescript
            p/python

      # Dependency scanning
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'

      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # License compliance
  license-check:
    needs: security-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check Go licenses
        run: |
          go install github.com/google/go-licenses@latest
          cd services/api
          go-licenses check ./... || true


  # Build and push Docker images
  build-images:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: services/api
            dockerfile: services/api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan container image
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image-${{ matrix.service }}.sarif'

  # Quality gates summary
  quality-gate:
    needs: [security-scan, license-check]
    runs-on: ubuntu-latest
    steps:
      - name: Quality Gate Summary
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generated | ✅ Complete |" >> $GITHUB_STEP_SUMMARY
