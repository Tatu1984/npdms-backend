apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: npdms-infrastructure

namespace: npdms

resources:
  # Base resources
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secrets.yaml

  # API
  - api/deployment.yaml

  # Database
  - database/postgresql-ha.yaml
  - database/redis-cluster.yaml

  # Ingress & Networking
  - ingress/ingress.yaml

  # Backup
  - backup/backup-cronjob.yaml

  # Monitoring
  - monitoring/prometheus.yaml

  # DR
  - dr/disaster-recovery.yaml

commonLabels:
  app.kubernetes.io/part-of: npdms
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
