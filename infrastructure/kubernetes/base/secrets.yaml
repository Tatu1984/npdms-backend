apiVersion: v1
kind: Secret
metadata:
  name: npdms-secrets
  namespace: npdms
  labels:
    app.kubernetes.io/name: npdms
type: Opaque
stringData:
  # These should be replaced with actual secrets via Vault or sealed-secrets
  DB_PASSWORD: "REPLACE_WITH_VAULT"
  REDIS_PASSWORD: "REPLACE_WITH_VAULT"
  JWT_SECRET: "REPLACE_WITH_VAULT"
  API_SIGNING_SECRET: "REPLACE_WITH_VAULT"
  S3_ACCESS_KEY: "REPLACE_WITH_VAULT"
  S3_SECRET_KEY: "REPLACE_WITH_VAULT"
  KAFKA_SASL_PASSWORD: "REPLACE_WITH_VAULT"
  ENCRYPTION_KEY: "REPLACE_WITH_VAULT"
---
apiVersion: v1
kind: Secret
metadata:
  name: npdms-tls
  namespace: npdms
  labels:
    app.kubernetes.io/name: npdms
type: kubernetes.io/tls
data:
  # Replace with actual TLS certificates
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: npdms-mtls-ca
  namespace: npdms
  labels:
    app.kubernetes.io/name: npdms
type: Opaque
data:
  # mTLS CA certificate for service-to-service communication
  ca.crt: ""
