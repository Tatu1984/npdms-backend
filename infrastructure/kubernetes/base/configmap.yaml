apiVersion: v1
kind: ConfigMap
metadata:
  name: npdms-config
  namespace: npdms
  labels:
    app.kubernetes.io/name: npdms
data:
  # API Configuration
  API_PORT: "8080"
  API_ENV: "production"
  API_LOG_LEVEL: "info"

  # Database Configuration
  DB_HOST: "postgresql-primary.npdms.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "npdms"
  DB_SSL_MODE: "require"
  DB_MAX_CONNECTIONS: "100"
  DB_MIN_CONNECTIONS: "10"

  # Redis Configuration
  REDIS_HOST: "redis-master.npdms.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CLUSTER_ENABLED: "true"

  # Kafka Configuration
  KAFKA_BROKERS: "kafka-0.kafka-headless.npdms.svc.cluster.local:9092,kafka-1.kafka-headless.npdms.svc.cluster.local:9092,kafka-2.kafka-headless.npdms.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "npdms-api"

  # S3/MinIO Configuration
  S3_ENDPOINT: "minio.npdms.svc.cluster.local:9000"
  S3_BUCKET_EVIDENCE: "npdms-evidence"
  S3_BUCKET_DOCUMENTS: "npdms-documents"
  S3_BUCKET_BACKUPS: "npdms-backups"

  # Service URLs
  ML_OCR_URL: "http://ocr-service.npdms.svc.cluster.local:8004"
  ML_TRANSCRIPTION_URL: "http://transcription-service.npdms.svc.cluster.local:8005"
  ML_VIDEO_ANALYSIS_URL: "http://video-analysis-service.npdms.svc.cluster.local:8006"

  # CORS Configuration
  CORS_ALLOWED_ORIGINS: "https://npdms.gov.in,https://admin.npdms.gov.in"

  # Session Configuration
  SESSION_TIMEOUT_MINUTES: "30"
  MAX_CONCURRENT_SESSIONS: "3"

  # Rate Limiting
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"
