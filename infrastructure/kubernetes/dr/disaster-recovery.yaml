apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-config
  namespace: npdms
data:
  # DR Configuration
  PRIMARY_REGION: "ap-south-1"
  SECONDARY_REGION: "ap-south-2"
  PRIMARY_CLUSTER: "npdms-primary"
  SECONDARY_CLUSTER: "npdms-dr"

  # Failover Settings
  HEALTH_CHECK_INTERVAL: "30"
  FAILOVER_THRESHOLD: "3"
  AUTO_FAILOVER_ENABLED: "false"

  # Replication Settings
  CROSS_REGION_REPLICATION: "true"
  REPLICATION_LAG_THRESHOLD_SECONDS: "60"

  dr-runbook.md: |
    # NPDMS Disaster Recovery Runbook

    ## Overview
    This document outlines the disaster recovery procedures for NPDMS.

    ## RTO/RPO Targets
    - RPO (Recovery Point Objective): 15 minutes
    - RTO (Recovery Time Objective): 1 hour

    ## Failure Scenarios

    ### 1. Single Pod Failure
    - **Detection**: Kubernetes liveness probe
    - **Recovery**: Automatic pod restart
    - **RTO**: < 1 minute

    ### 2. Node Failure
    - **Detection**: Kubernetes node health check
    - **Recovery**: Pod rescheduling to healthy nodes
    - **RTO**: < 5 minutes

    ### 3. Database Primary Failure
    - **Detection**: PostgreSQL health check fails
    - **Recovery**:
      1. Promote replica to primary
      2. Update service endpoints
      3. Rebuild failed node as replica
    - **RTO**: < 15 minutes

    ### 4. Redis Cluster Node Failure
    - **Detection**: Redis cluster health check
    - **Recovery**: Automatic failover by Redis cluster
    - **RTO**: < 1 minute

    ### 5. Full Zone Failure
    - **Detection**: Multiple node failures, zone unhealthy
    - **Recovery**:
      1. Kubernetes reschedules pods to other zones
      2. Database replicas in other zones take over
    - **RTO**: < 30 minutes

    ### 6. Full Region Failure (DR Event)
    - **Detection**: Primary region unreachable
    - **Recovery**:
      1. Activate DR site
      2. Update DNS to point to DR region
      3. Restore from latest backup if needed
    - **RTO**: < 1 hour

    ## Failover Procedures

    ### Database Failover
    ```bash
    # Promote replica to primary
    kubectl exec -n npdms postgresql-replica-0 -- \
      pg_ctl promote -D /var/lib/postgresql/data/pgdata

    # Update service to point to new primary
    kubectl patch svc postgresql-primary -n npdms \
      -p '{"spec":{"selector":{"statefulset.kubernetes.io/pod-name":"postgresql-replica-0"}}}'
    ```

    ### DNS Failover
    ```bash
    # Update Route53 to point to DR region
    aws route53 change-resource-record-sets \
      --hosted-zone-id $HOSTED_ZONE_ID \
      --change-batch file://dr-dns-change.json
    ```

    ### Full DR Activation
    ```bash
    # Scale up DR cluster
    kubectl config use-context npdms-dr

    # Apply latest configuration
    kubectl apply -k infrastructure/kubernetes/overlays/dr

    # Restore database from backup
    kubectl create job restore-db --from=cronjob/postgresql-restore -n npdms

    # Verify services
    kubectl get pods -n npdms
    kubectl get svc -n npdms
    ```

    ## Recovery Verification Checklist
    - [ ] All API pods running and healthy
    - [ ] Database accessible and serving requests
    - [ ] Redis cluster healthy
    - [ ] Kafka brokers connected
    - [ ] SSL certificates valid
    - [ ] Ingress routing correctly
    - [ ] Authentication working
    - [ ] Sample transactions successful
    - [ ] Monitoring alerting active

    ## Contact Escalation
    1. On-call SRE: +91-XXXXXXXXXX
    2. Database Admin: +91-XXXXXXXXXX
    3. Security Team: +91-XXXXXXXXXX
    4. Management: +91-XXXXXXXXXX
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dr-health-check
  namespace: npdms
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: health-check
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Check API health
                  API_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://npdms-api.npdms.svc.cluster.local/health)

                  # Check database
                  DB_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://npdms-api.npdms.svc.cluster.local/ready)

                  # Report status
                  if [ "$API_HEALTH" = "200" ] && [ "$DB_HEALTH" = "200" ]; then
                    echo "All systems healthy"
                    exit 0
                  else
                    echo "Health check failed: API=$API_HEALTH, DB=$DB_HEALTH"
                    exit 1
                  fi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: failover-scripts
  namespace: npdms
data:
  promote-replica.sh: |
    #!/bin/bash
    set -e

    echo "Starting PostgreSQL failover..."

    # Check current primary status
    PRIMARY_STATUS=$(kubectl exec -n npdms postgresql-primary-0 -- pg_isready -U npdms 2>/dev/null && echo "up" || echo "down")

    if [ "$PRIMARY_STATUS" = "up" ]; then
      echo "Primary is still up. Aborting failover."
      exit 1
    fi

    echo "Primary is down. Promoting replica..."

    # Find the replica with lowest lag
    BEST_REPLICA=""
    MIN_LAG=999999999

    for replica in postgresql-replica-0 postgresql-replica-1; do
      LAG=$(kubectl exec -n npdms $replica -- psql -U npdms -t -c "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::int" 2>/dev/null || echo 999999999)
      if [ "$LAG" -lt "$MIN_LAG" ]; then
        MIN_LAG=$LAG
        BEST_REPLICA=$replica
      fi
    done

    if [ -z "$BEST_REPLICA" ]; then
      echo "No healthy replica found!"
      exit 1
    fi

    echo "Promoting $BEST_REPLICA (lag: ${MIN_LAG}s)..."

    # Promote the replica
    kubectl exec -n npdms $BEST_REPLICA -- pg_ctl promote -D /var/lib/postgresql/data/pgdata

    # Wait for promotion
    sleep 10

    # Verify promotion
    IS_PRIMARY=$(kubectl exec -n npdms $BEST_REPLICA -- psql -U npdms -t -c "SELECT pg_is_in_recovery()" | tr -d ' ')

    if [ "$IS_PRIMARY" = "f" ]; then
      echo "Promotion successful!"

      # Update service selector
      kubectl patch svc postgresql-primary -n npdms \
        -p "{\"spec\":{\"selector\":{\"statefulset.kubernetes.io/pod-name\":\"$BEST_REPLICA\"}}}"

      echo "Service updated. Failover complete."
    else
      echo "Promotion failed!"
      exit 1
    fi

  activate-dr.sh: |
    #!/bin/bash
    set -e

    echo "Activating DR site..."

    # Switch kubectl context to DR cluster
    kubectl config use-context npdms-dr

    # Scale up all deployments
    kubectl scale deployment --all --replicas=3 -n npdms

    # Restore from latest backup
    LATEST_BACKUP=$(aws s3 ls s3://npdms-backups/postgresql/ | grep ".dump" | sort | tail -1 | awk '{print $4}')

    if [ -n "$LATEST_BACKUP" ]; then
      echo "Restoring from backup: $LATEST_BACKUP"
      kubectl create job dr-restore --from=cronjob/postgresql-restore -n npdms
      kubectl wait --for=condition=complete job/dr-restore -n npdms --timeout=1h
    fi

    # Update DNS (requires AWS credentials)
    echo "Updating DNS records..."
    aws route53 change-resource-record-sets \
      --hosted-zone-id ${HOSTED_ZONE_ID} \
      --change-batch '{
        "Changes": [{
          "Action": "UPSERT",
          "ResourceRecordSet": {
            "Name": "api.npdms.gov.in",
            "Type": "CNAME",
            "TTL": 60,
            "ResourceRecords": [{"Value": "dr-lb.npdms.gov.in"}]
          }
        }]
      }'

    echo "DR activation complete!"

  dr-test.sh: |
    #!/bin/bash
    set -e

    echo "Starting DR test..."

    # This script tests DR readiness without actual failover

    # 1. Test backup restore to DR
    echo "Testing backup restore..."
    kubectl config use-context npdms-dr
    kubectl create job dr-test-restore-$(date +%s) --from=cronjob/postgresql-restore -n npdms-dr-test

    # 2. Test connectivity
    echo "Testing connectivity..."
    kubectl run dr-test --rm -i --restart=Never --image=curlimages/curl -- \
      curl -s http://npdms-api.npdms-dr-test.svc.cluster.local/health

    # 3. Test replication lag
    echo "Checking replication lag..."
    LAG=$(kubectl exec -n npdms postgresql-replica-0 -- \
      psql -U npdms -t -c "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::int")

    if [ "$LAG" -gt 60 ]; then
      echo "WARNING: Replication lag is ${LAG}s (threshold: 60s)"
    else
      echo "Replication lag OK: ${LAG}s"
    fi

    # 4. Verify backup freshness
    echo "Checking backup freshness..."
    LATEST_BACKUP_DATE=$(aws s3 ls s3://npdms-backups/postgresql/ | grep ".dump" | sort | tail -1 | awk '{print $1" "$2}')
    echo "Latest backup: $LATEST_BACKUP_DATE"

    # Switch back to primary context
    kubectl config use-context npdms-primary

    echo "DR test complete!"
