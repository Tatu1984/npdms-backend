version: '3.8'

services:
  # API Service with HA
  api-1:
    image: npdms/api:latest
    container_name: npdms-api-1
    restart: always
    environment:
      - PORT=8080
      - ENV=production
      - DATABASE_URL=postgresql://npdms:${DB_PASSWORD}@postgresql-primary:5432/npdms?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-master:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=https://npdms.gov.in,https://admin.npdms.gov.in
    networks:
      - npdms-network
    depends_on:
      postgresql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  api-2:
    image: npdms/api:latest
    container_name: npdms-api-2
    restart: always
    environment:
      - PORT=8080
      - ENV=production
      - DATABASE_URL=postgresql://npdms:${DB_PASSWORD}@postgresql-primary:5432/npdms?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-master:6379
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - npdms-network
    depends_on:
      postgresql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-3:
    image: npdms/api:latest
    container_name: npdms-api-3
    restart: always
    environment:
      - PORT=8080
      - ENV=production
      - DATABASE_URL=postgresql://npdms:${DB_PASSWORD}@postgresql-primary:5432/npdms?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-master:6379
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - npdms-network
    depends_on:
      postgresql-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: npdms-nginx
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - npdms-network
    depends_on:
      - api-1
      - api-2
      - api-3
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Primary
  postgresql-primary:
    image: postgres:15-alpine
    container_name: npdms-postgresql-primary
    restart: always
    environment:
      - POSTGRES_DB=npdms
      - POSTGRES_USER=npdms
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - postgresql-primary-data:/var/lib/postgresql/data
      - ./postgresql/primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - npdms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npdms -d npdms"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  # PostgreSQL Replica 1
  postgresql-replica-1:
    image: postgres:15-alpine
    container_name: npdms-postgresql-replica-1
    restart: always
    environment:
      - POSTGRES_DB=npdms
      - POSTGRES_USER=npdms
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgresql-replica-1-data:/var/lib/postgresql/data
      - ./postgresql/replica.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - npdms-network
    depends_on:
      postgresql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npdms -d npdms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Replica 2
  postgresql-replica-2:
    image: postgres:15-alpine
    container_name: npdms-postgresql-replica-2
    restart: always
    environment:
      - POSTGRES_DB=npdms
      - POSTGRES_USER=npdms
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgresql-replica-2-data:/var/lib/postgresql/data
      - ./postgresql/replica.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - npdms-network
    depends_on:
      postgresql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npdms -d npdms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: npdms-redis-master
    restart: always
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-master-data:/data
      - ./redis/master.conf:/etc/redis/redis.conf:ro
    networks:
      - npdms-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: npdms-redis-replica-1
    restart: always
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD} --replicaof redis-master 6379 --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-replica-1-data:/data
      - ./redis/replica.conf:/etc/redis/redis.conf:ro
    networks:
      - npdms-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: npdms-redis-replica-2
    restart: always
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD} --replicaof redis-master 6379 --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-replica-2-data:/data
      - ./redis/replica.conf:/etc/redis/redis.conf:ro
    networks:
      - npdms-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: npdms-redis-sentinel-1
    restart: always
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    networks:
      - npdms-network
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  # Redis Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: npdms-redis-sentinel-2
    restart: always
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    networks:
      - npdms-network
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  # Redis Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: npdms-redis-sentinel-3
    restart: always
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf
    networks:
      - npdms-network
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  # Kafka (Zookeeper + Brokers)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: npdms-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - npdms-network
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: npdms-kafka-1
    restart: always
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - npdms-network
    depends_on:
      zookeeper:
        condition: service_healthy

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: npdms-kafka-2
    restart: always
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - npdms-network
    depends_on:
      zookeeper:
        condition: service_healthy

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: npdms-kafka-3
    restart: always
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - npdms-network
    depends_on:
      zookeeper:
        condition: service_healthy

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: npdms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - npdms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: npdms-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - npdms-network

  # Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: npdms-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - npdms-network
    depends_on:
      - prometheus

networks:
  npdms-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgresql-primary-data:
  postgresql-replica-1-data:
  postgresql-replica-2-data:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  zookeeper-data:
  zookeeper-log:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
  prometheus-data:
  grafana-data:
